      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ScrollMeter.apk

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: ScrollMeter-apk
          path: ScrollMeter.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ScrollMeter build ${{ github.run_number }}
          body: Download ScrollMeter.apk below and open it on your phone.
          files: ScrollMeter.apk
          make_latest: true
